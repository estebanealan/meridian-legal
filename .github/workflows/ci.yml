name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (Biome)
        run: npm run lint

      - name: Tests + Coverage
        run: npm run test:coverage || echo "No tests configured yet"

      - name: Audit high severity
        run: npm audit --audit-level=high || true

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for AI artifacts in source code
        run: |
          PATTERNS="Generated by|AI-generated|Copilot|ChatGPT|// This function |// Helper function|// The following code"
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.astro" --include="*.js" --include="*.jsx" -E "$PATTERNS" src/ 2>/dev/null; then
            echo "::error::Se encontraron comentarios de generación por IA. Limpiar antes de mergear."
            exit 1
          fi
          echo "✅ Sin comentarios de IA."

      - name: Check for console.log in source
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.astro" "console\.\(log\|debug\)" src/ --exclude-dir=__tests__ 2>/dev/null; then
            echo "::error::Se encontraron console.log/debug en código fuente. Usar logger estructurado."
            exit 1
          fi
          echo "✅ Sin console.log/debug."

      - name: Check for disposable scripts
        run: |
          FORBIDDEN="test\.ts$|temp\.|debug\.|fix\.ts$|quick-fix|one-time|patch-.*\.ts$"
          if find src/ scripts/ -type f 2>/dev/null | grep -E "$FORBIDDEN"; then
            echo "::error::Se encontraron scripts descartables o temporales en el codebase."
            exit 1
          fi
          echo "✅ Sin scripts descartables."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build
          path: dist/
          retention-days: 7

